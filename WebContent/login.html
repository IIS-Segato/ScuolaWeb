<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .center-block {
      margin-top: 100px;
      border: 1px solid lightgray;
      border-radius: 20px;
      padding: 20px;
      box-shadow: lightgray 2px 2px 10px;
      width: 50%;
      margin: 100px 50% 0px 20%;

    }

    div {
      margin: 15px;
    }
    
    #passwordInput {
      width: 10px;
      max-width: 200px;
      margin-right: 100px;
      border-radius: 9px;
    }

    .form-control {
      width: 50%;
    }

    img {
      width: 30px;
    }

    #showPswButton {
      margin-right: 10%;
      background-color: whitesmoke;
      border: 0.5px solid gray;
      border-radius: 16px;
    }

    #mainDiv {

    }

  </style>
</head>
<body>


  <div id="mainDiv" class="center-block">
    <form action="" method="post" class="navbar-form">
      <div>
        <input 
          type="text" 
          name="username" 
          class="form-control" 
          placeholder="username..." 
          id="usernameInput"
        >

      </div>
      <div class="input-group">
        <input 
          type="password" 
          name="psw" 
          class="form-control" 
          placeholder="password..."
          id="passwordInput"
        >
        <button 
          type="button"
          id="showPswButton"
        ><img src="images/closedEye.png" alt=""></button>
      </div>
      <div>
        <button 
          type="submit" 
          class="btn btn-primary"
          id="submitButton"
        >Invia</button>
      </div>
    </form>
  </div>
  <!-- Bootstrap JS -->
  <script src="library/bootstrap.js"></script>
  <script>
    const buttonShow = document.getElementById('showPswButton')

    buttonShow.addEventListener('click', (e) => {
        const input = document.getElementById('passwordInput')
        const img = document.querySelector('#showPswButton>img')
        if(input.type === 'password') {
            input.type = 'text'
            img.src = 'images/openEye.png'
        } else {
            input.type = 'password'
            img.src = 'images/closedEye.png'
            
        }
    })
  </script>
</body>
</html>
