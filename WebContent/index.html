<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portale Scuola</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: white;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">Accesso Portale</h2>
        <p class="text-muted">Inserisci le tue credenziali</p>
    </div>

    <form action="process_login.php" method="POST">
        <div class="mb-3">
            <label for="username" class="form-label">id</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="es: 123456" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Accedi come:</label>
            <select class="form-select" name="ruolo">
                <option value="studente">Studente</option>
                <option value="docente">Docente</option>
                <option value="admin">Amministratore</option>
            </select>
        </div>


        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">Accedi</button>
        </div>
    </form>

    <div class="text-center mt-3">
        <a href="#" class="text-decoration-none small">Password dimenticata?</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
