<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCEDI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

/* ── RESET & BASE ── */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg:          #0b0f14;
  --surface:     #111820;
  --surface2:    #161e28;
  --border:      rgba(255,255,255,0.07);
  --border-hi:   rgba(99,190,140,0.35);
  --accent:      #63be8c;
  --accent-bg:   rgba(99,190,140,0.08);
  --text-1:      #e8f0ec;
  --text-2:      #8a9fa4;
  --text-3:      #4d6168;
  --red:         #f87171;
  --red-bg:      rgba(248,113,113,0.07);
  --red-border:  rgba(248,113,113,0.25);
  --mono:        'DM Mono', monospace;
  --sans:        'DM Sans', sans-serif;
  --radius-sm:   8px;
  --radius-md:   12px;
  --radius-lg:   18px;
  --radius-xl:   24px;
}

html, body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ── SFONDO DECORATIVO ── */

body::before {
  content: '';
  position: fixed;
  top: -120px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(99,190,140,0.055) 0%, transparent 70%);
  pointer-events: none;
}

/* ── CARD ── */

.card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 36px 32px 32px;
  width: 360px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  animation: fadeUp .5s ease both;
}

/* ── LOGO ── */

.logo-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.logo-icon {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-md);
  background: var(--accent-bg);
  border: 0.5px solid var(--border-hi);
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-icon svg {
  width: 26px;
  height: 26px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.logo-text {
  text-align: center;
}

.logo-text h1 {
  font-size: 18px;
  font-weight: 500;
  color: var(--text-1);
  letter-spacing: 0.01em;
}

.logo-text p {
  font-size: 13px;
  color: var(--text-3);
  margin-top: 3px;
}

/* ── DIVISORE ── */

.divider {
  height: 0.5px;
  background: var(--border);
}

/* ── ERROR BOX ── */

.error-box {
  background: var(--red-bg);
  border: 0.5px solid var(--red-border);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  display: none;
  align-items: center;
  gap: 10px;
}

.error-box.show {
  display: flex;
  animation: fadeSlide 0.3s ease forwards;
}

.error-box svg {
  flex-shrink: 0;
  width: 15px;
  height: 15px;
  stroke: var(--red);
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.error-text {
  font-size: 13px;
  color: var(--red);
}

/* ── FORM ── */

.form-fields {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.field input {
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-1);
  font-family: var(--sans);
  font-size: 14px;
  padding: 11px 14px;
  outline: none;
  transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  width: 100%;
}

.field input::placeholder {
  color: var(--text-3);
  font-family: var(--mono);
  font-size: 13px;
}

.field input:hover {
  border-color: rgba(255,255,255,0.12);
}

.field input:focus {
  border-color: var(--border-hi);
  background: #161e28;
  box-shadow: 0 0 0 3px rgba(99,190,140,0.10);
}

/* ── BOTTONE ── */

.btn {
  width: 100%;
  background: var(--accent-bg);
  border: 0.5px solid var(--border-hi);
  border-radius: var(--radius-sm);
  color: var(--accent);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  padding: 12px;
  cursor: pointer;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  transition: background .2s ease, transform .15s ease, box-shadow .2s ease, border-color .2s ease;
}

.btn:hover {
  background: rgba(99,190,140,0.14);
  border-color: var(--accent);
  box-shadow: 0 4px 18px rgba(99,190,140,0.14);
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(0);
  box-shadow: none;
}

/* ── ANIMAZIONI ── */

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(-5px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── RESPONSIVE ── */

@media (max-width: 420px) {
  .card { width: 100%; margin: 16px; padding: 28px 20px 24px; }
}

</style>
</head>
<body>

<div class="card">

  <!-- LOGO E TITOLO -->

  <div class="logo-wrap">

    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>

    <div class="logo-text">
      <h1>Gestionale scuola</h1>
      <p>Accedi al portale scolastico</p>
    </div>

  </div>

  <div class="divider"></div>

  <!-- Controlla la querystring: mostra errore se ?error è presente -->

  <div id="err" class="error-box">

    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>

    <span class="error-text">Credenziali non valide. Riprova.</span>

  </div>

  <!-- FORM -->

  <form action="login" method="post">

    <div class="form-fields">

      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="nome@email.com"
          autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password">
      </div>

    </div>

    <button class="btn" type="submit" style="margin-top: 20px;">
      Accedi
    </button>

  </form>

</div>

<script>
  function showErr(v) {
    const b = document.getElementById('err');
    if (v) {
      b.classList.remove('show');
      void b.offsetWidth; // forza reflow per riavviare l'animazione
      b.classList.add('show');
    } else {
      b.classList.remove('show');
    }
  }

  // Controlla la querystring: mostra errore se ?error è presente
  const params = new URLSearchParams(window.location.search);
  if (params.has('error')) {
    showErr(true);
  }
</script>

</body>
</html>
