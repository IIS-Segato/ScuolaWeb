<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>ACCEDI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: #0d1117;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    background: #161b22;
    border: 0.5px solid #2a3a2e;
    border-radius: 12px;
    padding: 2rem 1.75rem;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .icon-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 0.1rem;
  }

  .title {
    text-align: center;
    font-size: 17px;
    font-weight: 500;
    color: #c8e6c9;
    letter-spacing: 0.03em;
  }

  .sub {
    text-align: center;
    font-size: 12px;
    color: #4a6650;
    margin-top: -0.4rem;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }

  .field label {
    font-size: 11px;
    font-weight: 500;
    color: #6a9a72;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  .field input {
    background: #0d1117;
    border: 0.5px solid #2a3a2e;
    border-radius: 8px;
    color: #c8e6c9;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    width: 100%;
  }

  .field input::placeholder { color: #3a4f3e; }
  .field input:hover { border-color: #3a6b44; }
  .field input:focus {
    border-color: #2d6a3a;
    box-shadow: 0 0 0 3px rgba(45, 106, 58, 0.18);
  }

  .btn {
    background: #1e4d28;
    border: 0.5px solid #2d6a3a;
    border-radius: 8px;
    color: #a5d6a7;
    font-size: 13px;
    font-weight: 500;
    padding: 11px;
    cursor: pointer;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    width: 100%;
    margin-top: 0.2rem;
  }

  .btn:hover {
    background: #2d6a3a;
    box-shadow: 0 4px 14px rgba(45, 106, 58, 0.25);
    transform: translateY(-1px);
  }

  .btn:active { transform: translateY(0); box-shadow: none; }

  .error-box {
    background: #1a0f0f;
    border: 0.5px solid #6b2a2a;
    border-radius: 8px;
    padding: 10px 12px;
    display: none;
    align-items: center;
    gap: 9px;
  }

  .error-box.show {
    display: flex;
    animation: fadeSlide 0.3s ease forwards;
  }

  .error-text { font-size: 13px; color: #f48771; }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="card">

  <div class="icon-wrap">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <rect x="6" y="14" width="36" height="26" rx="2" fill="#1a3a22" stroke="#2d6a3a" stroke-width="1"/>
      <rect x="12" y="20" width="10" height="7" rx="1" fill="#2d6a3a"/>
      <rect x="26" y="20" width="10" height="2" rx="0.5" fill="#2d6a3a"/>
      <rect x="26" y="24" width="7" height="2" rx="0.5" fill="#2d6a3a"/>
      <rect x="12" y="30" width="24" height="2" rx="0.5" fill="#2d6a3a"/>
      <rect x="12" y="34" width="18" height="2" rx="0.5" fill="#2d6a3a"/>
      <path d="M16 14V10a8 8 0 0 1 16 0v4" stroke="#4caf50" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="24" cy="9" r="2.5" fill="#4caf50"/>
    </svg>
  </div>

  <p class="title">Gestione scuola</p>
  <p class="sub">Accedi al portale scolastico</p>

  <div id="err" class="error-box">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0">
      <circle cx="8" cy="8" r="7" stroke="#f48771" stroke-width="1"/>
      <line x1="8" y1="4.5" x2="8" y2="9" stroke="#f48771" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="8" cy="11.5" r="0.8" fill="#f48771"/>
    </svg>
    <span class="error-text">Credenziali non valide. Riprova.</span>
  </div>

  <form action="login" method="post">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="nome@email.com">
    </div>

    <div class="field" style="margin-top: 0.6rem;">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••">
    </div>

    <button class="btn" type="submit" style="margin-top: 1rem;">Accedi</button>
  </form>

</div>

<script>
  function showErr(v) {
    const b = document.getElementById('err');
    if (v) {
      b.classList.remove('show');
      void b.offsetWidth; // forza reflow per riavviare l'animazione
      b.classList.add('show');
    } else {
      b.classList.remove('show');
    }
  }

  // Controlla la querystring: mostra errore se ?error è presente
  const params = new URLSearchParams(window.location.search);
  if (params.has('error')) {
    showErr(true);
  }
</script>

</body>
</html>
