<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to bottom, #dff7ef, #f7fffc);
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }

        /* NAVBAR */
        #upBar {
            background-color: #146c5c;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #logoSection {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #logoSection img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid white;
        }

        #logoSection h2 {
            color: white;
            margin: 0;
        }

        .nav-links a {
            color: white;
            margin-left: 15px;
            text-decoration: none;
        }

        /* MAIN */
        .main-container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            margin-top: 40px;
        }

        .title {
            font-size: 34px;
            color: #146c5c;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* DASHBOARD CARDS */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .dash-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            transition: 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: black;
        }

        .dash-card:hover {
            transform: translateY(-5px);
        }

        .dash-title {
            font-size: 22px;
            font-weight: bold;
            color: #146c5c;
            margin-top: 10px;
        }

        .dash-icon {
            font-size: 50px;
        }

        .voti { color: #146c5c; }
        .orario { color: #0d6efd; }
        .news { color: #ff9800; }
        .logout { color: red; }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div id="upBar">

    <div id="logoSection">
        <img src="default_avatar.webp" alt="avatar">
        <h2>Registro Studente</h2>
    </div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="voti.html">Voti</a>
        <a href="notizie.html">Notizie</a>
        <a href="orario.html">Orario</a>
        <a href="#">Logout</a>
    </div>

</div>

<!-- MAIN -->
<div class="main-container">

    <div class="title">
        Dashboard
    </div>

    <div class="dashboard-grid">

        <!-- VOTI -->
        <a href="voti.html" class="dash-card">
            <div class="dash-icon voti">📊</div>
            <div class="dash-title">Voti</div>
        </a>

        <!-- ORARIO -->
        <a href="orario.html" class="dash-card">
            <div class="dash-icon orario">🕒</div>
            <div class="dash-title">Orario</div>
        </a>

        <!-- NOTIZIE -->
        <a href="notizie.html" class="dash-card">
            <div class="dash-icon news">📰</div>
            <div class="dash-title">Notizie</div>
        </a>

        <!-- LOGOUT -->
        <a href="#" class="dash-card">
            <div class="dash-icon logout">🚪</div>
            <div class="dash-title">Logout</div>
        </a>

    </div>

</div>

</body>

</html>
