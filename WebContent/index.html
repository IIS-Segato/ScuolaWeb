<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Portale Scolastico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-page">

    <!-- Visual panel -->
    <div class="login-visual">
      <div class="login-visual-text">
        <h2>Benvenuto nel portale scolastico</h2>
        <p>Accedi per consultare orari, classi e informazioni del tuo istituto.</p>
      </div>
    </div>

    <!-- Form panel -->
    <div class="login-panel">
      <div class="login-brand">Istituto Scolastico</div>
      <div class="login-tagline">Portale Didattico</div>

      <form action="login" method="post">
        <div class="form-group">
          <label class="form-label required">Email</label>
          <input class="form-control" type="email" name="email" placeholder="nome.cognome@scuola.it" required>
        </div>

        <div class="form-group">
          <label class="form-label required">Password</label>
          <input class="form-control" type="password" name="password" placeholder="••••••••" required>
        </div>

        <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center; padding:12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Accedi
        </button>
      </form>

      <div class="login-divider">oppure</div>

      <a href="orario" class="btn btn-ghost" style="width:100%; justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Visualizza Orario Aule
      </a>
    </div>

  </div>
</body>
</html>
