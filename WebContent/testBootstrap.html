<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Test</title>
  <!-- Bootstrap CSS -->
  <link href="WEB-INF/lib/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <div id="mainDiv" class="center-block">
    <p>Login</p>
    <form action="" method="post" class="navbar-form">
      <div>
        <input 
          type="text" 
          name="username" 
          class="form-control" 
          placeholder="username..." 
          id="usernameInput"
        >

      </div>
      <div class="input-group">
        <input 
          type="password" 
          name="psw" 
          class="form-control passwordInput" 
          placeholder="password..."
          id="passwordInput"
        >
        <button 
          type="button"
          id="showPswButton"
        ><img src="imgs/closedEye.png" alt=""></button>
      </div>
      <div>
        <button 
          type="submit" 
          class="btn btn-primary"
          id="submitButton"
        >Invia</button>
      </div>
    </form>
  </div>
  <!-- Bootstrap JS -->
  <script src="library/bootstrap.js"></script>
  <script>
    const buttonShow = document.getElementById('showPswButton')

    buttonShow.addEventListener('click', (e) => {
        const input = document.getElementById('passwordInput')
        const img = document.querySelector('#showPswButton>img')
        if(input.type === 'password') {
            input.type = 'text'
            img.src = 'imgs/openEye.png'
        } else {
            input.type = 'password'
            img.src = 'imgs/closedEye.png'
            
        }
    })
  </script>
</body>
</html>
