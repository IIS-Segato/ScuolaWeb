<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

	<!-- Stile -->
    <link href="WEB-INF/lib/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<!-- Banner -->
	<div id="banner">
	    <div id="logo">
	        <img src="imgs/default.png" alt="admin">
	        <h2>Panello Admin</h2>
	    </div>
	    <div class="admin-badge">AMMINISTRATORE</div>
	</div>
	
	<!-- Main -->
	<div class="main-container">
	    <div class="title">Dashboard amministratore</div>
	    <div class="admin-grid">
	
	        <!-- Studenti -->
	        <a href="creaAccount.html" class="admin-card">
	            <div class="icon students">👨‍🎓</div>
	            <div class="card-title">Studenti</div>
	            <div class="desc">Crea account per studenti o docenti</div>
	        </a>
	
	        <!-- Voti -->
	        <a href="gestioneVoti.html" class="admin-card">
	            <div class="icon grades">📊</div>
	            <div class="card-title">Voti</div>
	            <div class="desc">Inserisci e modifica voti</div>
	        </a>
	
	        <!-- Notizie -->
	        <a href="creareNotizie.html" class="admin-card">
	            <div class="icon news">📰</div>
	            <div class="card-title">Notizie</div>
	            <div class="desc">Pubblica comunicazioni</div>
	        </a>
	
	        <!-- Orario -->
	        <a href="#" class="admin-card">
	            <div class="icon schedule">🕒</div>
	            <div class="card-title">Orario</div>
	            <div class="desc">Gestisci orario classi</div>
	        </a>
	
	        <!-- Logout -->
	        <a href="#" class="admin-card">
	            <div class="icon">🚪</div>
	            <div class="card-title">Logout</div>
	            <div class="desc">Esci dal pannello admin</div>
	        </a>

			<a href="gestioneAccounts.html" class="admin-card">
	            <div class="icon">⚙️</div>
	            <div class="card-title">Gestione accounts</div>
	            <div class="desc">Gestione dei dati degli account</div>
	        </a>
	    </div>
	</div>
</body>
</html>
