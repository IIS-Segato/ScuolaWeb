<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to bottom, #dff7ef, #f7fffc);
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }

        /* NAVBAR */
        #upBar {
            background-color: #0f5145;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #logoSection {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #logoSection img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid white;
        }

        #logoSection h2 {
            color: white;
            margin: 0;
        }

        .admin-badge {
            background: #ff3b3b;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        /* MAIN */
        .main-container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            margin-top: 40px;
        }

        .title {
            font-size: 34px;
            color: #0f5145;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* DASHBOARD GRID */
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .admin-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            transition: 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: black;
        }

        .admin-card:hover {
            transform: translateY(-5px);
        }

        .icon {
            font-size: 50px;
        }

        .card-title {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            color: #0f5145;
        }

        .desc {
            font-size: 14px;
            color: gray;
            margin-top: 5px;
        }

        .students { color: #146c5c; }
        .grades { color: #198754; }
        .news { color: #fd7e14; }
        .schedule { color: #0d6efd; }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div id="upBar">

    <div id="logoSection">
        <img src="default_avatar.webp" alt="admin">
        <h2>Admin Panel</h2>
    </div>

    <div class="admin-badge">AMMINISTRATORE</div>

</div>

<!-- MAIN -->
<div class="main-container">

    <div class="title">
        Dashboard amministratore
    </div>

    <div class="admin-grid">

        <!-- STUDENTI -->
        <a href="#" class="admin-card">
            <div class="icon students">👨‍🎓</div>
            <div class="card-title">Studenti</div>
            <div class="desc">Gestisci utenti e iscrizioni</div>
        </a>

        <!-- VOTI -->
        <a href="gestioneVoti.html" class="admin-card">
            <div class="icon grades">📊</div>
            <div class="card-title">Voti</div>
            <div class="desc">Inserisci e modifica voti</div>
        </a>

        <!-- NOTIZIE -->
        <a href="#" class="admin-card">
            <div class="icon news">📰</div>
            <div class="card-title">Notizie</div>
            <div class="desc">Pubblica comunicazioni</div>
        </a>

        <!-- ORARIO -->
        <a href="#" class="admin-card">
            <div class="icon schedule">🕒</div>
            <div class="card-title">Orario</div>
            <div class="desc">Gestisci orario classi</div>
        </a>

        <!-- LOGOUT -->
        <a href="#" class="admin-card">
            <div class="icon">🚪</div>
            <div class="card-title">Logout</div>
            <div class="desc">Esci dal pannello admin</div>
        </a>

    </div>

</div>

</body>

</html>
