<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Errore Credenziali</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ece9e6, #ffffff);
            font-family: "Segoe UI", sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px 60px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        h1 {
            color: #c40000;
            font-size: 34px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            font-size: 17px;
            border-radius: 8px;
            transition: 0.25s;
            font-weight: 500;
        }

        .btn:hover {
            background: #155bb5;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        <h1>CREDENZIALI NON VALIDE</h1>
