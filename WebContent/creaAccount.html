<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Gestione utenti</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: #eefaf6;
            font-family: Arial;
        }

        .container-box {
            width: 90%;
            max-width: 800px;
            margin: auto;
            margin-top: 40px;
        }

        .card-custom {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            color: #0f5145;
            margin-bottom: 25px;
        }

        #backPageBtn {
            display: inline-block;
            margin: 20px;
            padding: 10px 18px;
            background: #146c5c;
            color: white;
            border-radius: 10px;
            text-decoration: none;
        }
        
        #docenteDiv {
        	display: none;
        }

    </style>
</head>

<body>

<a id="backPageBtn" href="admin.html">← Indietro</a>

<div class="container-box">

    <div class="card-custom">

        <h2>Crea account</h2>

        <form>

            <div class="mb-3">
                <label>Nome</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label>Cognome</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control">
            </div>

            <div class="mb-3">
                <label>Ruolo</label>

                <select class="form-select" id="roleSelect">
                    <option>Studente</option>
                    <option>Docente</option>
                </select>
            </div>
            
            <div class="mb-3" id="docenteDiv">
                <label class="form-label">Materie</label>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="materie" value="elettronica">
                    <label class="form-check-label">Elettronica</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="materie" value="informatica">
                    <label class="form-check-label">Informatica</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="materie" value="inglese">
                    <label class="form-check-label">Inglese</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="materie" value="italiano">
                    <label class="form-check-label">Italiano</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="materie" value="matematica">
                    <label class="form-check-label">Matematica</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="materie" value="scienze_motorie">
                    <label class="form-check-label">Scienze motorie</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="materie" value="sistemi_reti">
                    <label class="form-check-label">Sistemi e reti</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="materie" value="storia">
                    <label class="form-check-label">Storia</label>
                </div>
            </div>

            <button class="btn btn-success">
                Crea account
            </button>

        </form>

    </div>

</div>
<script>
    const select = document.getElementById("roleSelect");
    const docenteDiv = document.getElementById("docenteDiv");
    const inputCheck = document.querySelectorAll(".form-check-input");

    select.addEventListener("change", function () {
        if (this.value === 'Docente') {
            docenteDiv.style.display = "block"
            
        } else {
            docenteDiv.style.display = "none"
            inputCheck.forEach( el => {
                el.checked = false
            })
        }
    });
</script>
</body>
</html>
