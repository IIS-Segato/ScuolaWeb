<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Gestione utenti</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: #eefaf6;
            font-family: Arial;
        }

        .container-box {
            width: 90%;
            max-width: 800px;
            margin: auto;
            margin-top: 40px;
        }

        .card-custom {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            color: #0f5145;
            margin-bottom: 25px;
        }

        #backPageBtn {
            display: inline-block;
            margin: 20px;
            padding: 10px 18px;
            background: #146c5c;
            color: white;
            border-radius: 10px;
            text-decoration: none;
        }

    </style>
</head>

<body>

<a id="backPageBtn" href="admin.html">← Indietro</a>

<div class="container-box">

    <div class="card-custom">

        <h2>Crea account</h2>

        <form>

            <div class="mb-3">
                <label>Nome</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label>Cognome</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control">
            </div>

            <div class="mb-3">
                <label>Ruolo</label>

                <select class="form-select">
                    <option>Studente</option>
                    <option>Docente</option>
                </select>
            </div>

            <button class="btn btn-success">
                Crea account
            </button>

        </form>

    </div>

</div>

</body>
</html>
