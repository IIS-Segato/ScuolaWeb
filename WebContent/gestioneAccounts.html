<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<title>Gestione Account</title>

<link rel="stylesheet" href="style.css">

<style>

/* PAGINA GESTIONE ACCOUNT */

.account-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}

.account-table th {
    background: #146c5c;
    color: white;
    padding: 15px;
    text-align: left;
}

.account-table td {
    padding: 15px;
    border-bottom: 1px solid #eee;
}

.account-table tr:hover {
    background: #f7fffc;
}

.account-input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid lightgray;
    outline: none;
}

.action-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.save-btn,
.password-btn,
.delete-btn {
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

.save-btn {
    background: #146c5c;
}

.save-btn:hover {
    background: #0f5a4c;
}

.password-btn {
    background: #ff9800;
}

.password-btn:hover {
    background: #e68900;
}

.delete-btn {
    background: #dc3545;
}

.delete-btn:hover {
    background: #bb2d3b;
}

/* Input moderni */

.custom-input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #d9d9d9;
    border-radius: 14px;
    background-color: #fdfdfd;
    font-size: 15px;
    transition: 0.2s;
    margin-bottom: 18px;
    box-sizing: border-box;
}

/* Hover */
.custom-input:hover {
    border-color: #146c5c;
}

/* Focus */
.custom-input:focus {
    outline: none;
    border-color: #146c5c;
    box-shadow: 0 0 8px rgba(20,108,92,0.25);
    background-color: white;
}

/* Placeholder */
.custom-input::placeholder {
    color: #999;
}

/* Select */
select.custom-input {
    cursor: pointer;
}

/* Textarea */
textarea.custom-input {
    min-height: 180px;
    resize: vertical;
    font-family: Arial, Helvetica, sans-serif;
}

</style>

</head>

<body>

<!-- BANNER -->

<div id="banner">

    <div id="logo">
        <img src="imgs/default.png">
        <h2>Registro Elettronico</h2>

        <span class="admin-badge">
            ADMIN
        </span>
    </div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Logout</a>
    </div>

</div>

<a href="admin.html" id="indietro">
    ← Indietro
</a>

<div class="main-container">

    <div class="title">
        Gestione Account
    </div>
    <div>
        <input 
            type="text"
            class="custom-input"
            placeholder="Cerca utente"
        >
    </div>

    <table class="account-table">

        <thead>

            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Gmail</th>
                <th>Azioni</th>
            </tr>

        </thead>

        <tbody>

            <!-- UTENTE -->

            <tr>

                <td>1</td>

                <td>
                    <input type="text"
                           class="account-input"
                           value="Lucian">
                </td>

                <td>
                    <input type="email"
                           class="account-input"
                           value="lucian@gmail.com">
                </td>

                <td>

                    <div class="action-buttons">

                        <button class="save-btn">
                            Salva
                        </button>

                        <button class="password-btn"
                                onclick="changePassword(1)">
                            Password
                        </button>

                        <button class="delete-btn"
                                onclick="deleteAccount(1)">
                            Elimina
                        </button>

                    </div>

                </td>

            </tr>

            <!-- ALTRO UTENTE -->

            <tr>

                <td>2</td>

                <td>
                    <input type="text"
                           class="account-input"
                           value="Marco">
                </td>

                <td>
                    <input type="email"
                           class="account-input"
                           value="marco@gmail.com">
                </td>

                <td>

                    <div class="action-buttons">

                        <button class="save-btn">
                            Salva
                        </button>

                        <button class="password-btn"
                                onclick="changePassword(2)">
                            Password
                        </button>

                        <button class="delete-btn"
                                onclick="deleteAccount(2)">
                            Elimina
                        </button>

                    </div>

                </td>

            </tr>

        </tbody>

    </table>

</div>

<script>

function changePassword(id){

    let newPassword = prompt(
        "Inserisci nuova password:"
    );

    if(newPassword){

        console.log(
            "Cambio password utente:",
            id,
            newPassword
        );

        // fetch/ajax/jsp

    }

}

function deleteAccount(id){

    let confirmDelete = confirm(
        "Vuoi eliminare questo account?"
    );

    if(confirmDelete){

        console.log(
            "Elimina account:",
            id
        );

        // fetch/ajax/jsp

    }

}

</script>

</body>
</html>
