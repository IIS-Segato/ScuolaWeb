<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="WEB-INF/lib/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Cambia Password</title>
</head>
<body>
    <div class="center-block" id="mainDiv">
        <p>Nuova password</p>
        <form action="" method="post" class="navbar-form">
            <div>
                <input 
                    type="password" 
                    name="psw1"
                    class="form-control passwordInput" 
                    placeholder="nuova password..."
                >
            </div>
            <div>
                <input 
                    type="password" 
                    name="psw2"
                    class="form-control passwordInput"  
                    placeholder="ripeti password"   
                >
                <button 
                    type="button"
                    id="showPswButton"
                ><img src="imgs/closedEye.png" alt=""></button>
            </div>
            <div>
                <button 
                    type="submit"
                    class="btn btn-primary"
                >Cambia</button>
            </div>
        </form>
    </div>
    <script>
        
        const button = document.getElementById("showPswButton")
        
        button.addEventListener('click', (e) => {
            const inputs = document.querySelectorAll("input")
            const img = document.querySelector("img")
            
            inputs.forEach((input) => {
                if (input.type === 'password') {
                    input.type = 'text'
                    img.src = 'imgs/openEye.png'
                } else {
                    input.type = 'password'
                    img.src = 'imgs/closedEye.png'
                }
            })
        })
</script>
</body>
</html>
