<link rel="stylesheet" href="lib/bootstrap.min.css">
<style>
    #upBar {
        position: fixed;
        top: 0;

        background-color: rgba(25, 174, 233, 0.625);
        background-image: linear-gradient(to right, rgba(25, 174, 233, 0.625), rgb(16, 212, 169));
    }

    img{
        width: 60px;
        height: 60px;

        margin-left: 15px;
    }

        margin-left: 20%;

        box-shadow: rgba(0, 0, 0, 0.146) 1px 2px 2px;

</style>
